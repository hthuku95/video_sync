services:
  - type: web
    name: video-editor-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: VOYAGEAI_API_KEY
        sync: false
      - key: RUST_LOG
        value: info
      - key: FRONTEND_URL
        value: https://cmachine.devthuku.io
    healthCheckPath: /
    autoDeploy: true
