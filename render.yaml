# Render Blueprint — VideoSync full stack
# Deploy: push this file to GitHub, then create Blueprint in Render Dashboard
# Free tier: web service sleeps after 15min idle. Paid ($7/mo) for always-on.

services:
  - type: web
    name: video-editor-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: videosync-production
      - key: R2_ACCOUNT_ID
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_MODEL
        value: qwen3.7-plus
      - key: QWEN_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: SES_FROM_EMAIL
        value: VideoSync <support@videosync.ink>
      - key: BLENDER_MCP_URL
        value: http://localhost:8000
      - key: YTDLP_API_URL
        value: http://localhost:8001
      - key: VIBEVOICE_SERVICE_URL
        value: http://localhost:8015
      - key: HYPERFRAMES_URL
        value: http://localhost:8082
      - key: RUST_LOG
        value: info
      - key: CLIPPING_SQS_QUEUE_URL
        value: ""
      - key: AGENTIC_RENDER_WORKERS
        value: "1"
      - key: AGENTIC_LEASE_MINUTES
        value: "10"
      - key: AGENTIC_WORKER_POLL_SECS
        value: "5"
      - key: AGENTIC_MAX_RUN_HOURS
        value: "6"
      - key: CAMPAIGN_STALE_MINUTES
        value: "90"
      - key: ARTIFACT_MIN_BYTES
        value: "50000"

  - type: keyvalue
    name: clipping-queue
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
