upstream vibevoice_tts {
    server 127.0.0.1:8016;
    keepalive 16;
}

upstream vibevoice_asr {
    server 127.0.0.1:8017;
    keepalive 16;
}

server {
    listen 8015;
    server_name _;

    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    location = /health {
        proxy_pass http://vibevoice_tts/health;
    }

    location = /health/asr {
        proxy_pass http://vibevoice_asr/health;
    }

    location = /metrics/asr {
        proxy_pass http://vibevoice_asr/metrics;
    }

    location /api/transcribe {
        proxy_pass http://vibevoice_asr;
    }

    location / {
        proxy_pass http://vibevoice_tts;
    }
}
