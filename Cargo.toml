[package]
name = "video_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7.5", features = ["ws", "multipart"] }
tokio = { version = "1.37.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1.73"
# default-features = false kills sqlx's `any` driver feature which otherwise
# drags in sqlx-sqlite → libsqlite3-sys and collides with grammers-session's
# own native `sqlite3` link (two crates can't `links = "sqlite3"`). We only
# need the postgres driver.
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate", "rust_decimal", "json", "uuid"] }
dotenvy = "0.15.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json", "registry"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
backoff = { version = "0.4", features = ["tokio"] }
base64 = "0.22"
sha2 = "0.10"
bcrypt = "0.15"
jsonwebtoken = "9.2"
tower-http = { version = "0.6", features = ["cors"] }
qdrant-client = "1.12.1"
# Statically compile OpenSSL to remove the dynamic libssl.so.3 dependency.
# qdrant-client → reqwest → native-tls → openssl-sys dynamically links libssl.so.3.
# Render's build and runtime images may have different OpenSSL versions causing
# nonZeroExit:101 on startup. Vendored = compile OpenSSL from source statically.
openssl = { version = "0.10", features = ["vendored"] }
tonic = "0.12"
rand = "0.8"
hex = "0.4"
rpassword = "7.3"
lazy_static = "1.4"
regex = "1.11.2"
rust_decimal = { version = "1.36.0", features = ["serde", "db-postgres"] }
thiserror = "1.0"
url = "2.5"
urlencoding = "2.1"
rusty_ytdl = "0.7.4"
rustube = "0.6.0"                    # Pure Rust YouTube downloader (fallback #1)
# yt-dlp is used via CLI in ytdlp_client.rs (no crate needed)
rust-yt-downloader = "0.1"           # Feature-rich yt-dlp wrapper (fallback #3)
hostname = "0.4"                     # Worker ID generation for parallel processing
# Use ring (pure Rust crypto) instead of aws-lc-sys (C/C++ AWS-LC) to prevent
# OpenSSL symbol conflicts: aws-lc-sys exports OpenSSL-compatible C symbols which
# clash with openssl-sys's dynamic libssl.so.3 (pulled in by qdrant-client →
# native-tls) causing a nonZeroExit:101 Rust panic on startup in production.
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
# rustls 0.23 (pulled in by qdrant-client 1.15+) requires an explicit CryptoProvider
# when both ring and aws-lc-rs features are active. We declare rustls directly so
# we can call install_default() at startup before any TLS connection is made.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Telegram MTProto (Client API / userbot) — used for automated channel
# monitoring: grammers-client subscribes to configured Telegram channels,
# detects "need editor / hiring" posts, scores them via our LLM, and
# pings the admin bot with a pre-written custom DM. See src/telegram_client.rs.
#
# We pin to a git revision on master rather than the published v0.8.0
# tag because:
#   1. grammers-session v0.8.0 on crates.io has a HARD (non-optional)
#      dep on `sqlite 0.37.0` which links the native `sqlite3` C library.
#      That collides with sqlx-sqlite's libsqlite3-sys (both `links =
#      "sqlite3"`), and Cargo refuses to resolve.
#   2. Master has already made sqlite backing optional (behind a
#      "sqlite-storage" feature) — and grammers-client itself now
#      passes `default-features = false` when depending on
#      grammers-session. No sqlite native library is linked and the
#      collision goes away.
# Pinned commit for reproducibility — bump intentionally.
grammers-client  = { git = "https://github.com/Lonami/grammers", rev = "fa7692e49f301f16dc671c2f305ac1a32cad1a8e" }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "fa7692e49f301f16dc671c2f305ac1a32cad1a8e", default-features = false, features = ["serde"] }

